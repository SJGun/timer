<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자율시간 타이머</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gothic+A1:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1f3a35;--panel:#274741;--line:#4d7068;--chalk:#f4f1e8;--dim:#a9c0b9;--yellow:#f2cf5b;--red:#ee8a7a}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--chalk);font-family:"Gothic A1",system-ui,sans-serif;padding:24px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;max-width:1280px;margin:0 auto}
@media(max-width:900px){body{grid-template-columns:1fr}}
section{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:24px}
h2{margin:0 0 14px;font-size:1.05rem;font-weight:700;color:var(--dim)}
#time{font-family:Jua,sans-serif;font-size:clamp(5rem,17vw,12rem);line-height:1;text-align:center;letter-spacing:.02em;margin:8px 0 14px;font-variant-numeric:tabular-nums}
#time.end{color:var(--red)}
.bar{height:10px;background:var(--bg);border-radius:6px;overflow:hidden;margin-bottom:22px}
#fill{height:100%;width:100%;background:var(--yellow);transition:width .25s linear}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
button{font:inherit;font-weight:700;border:2px solid var(--line);background:transparent;color:var(--chalk);border-radius:10px;padding:10px 18px;cursor:pointer}
button:hover{border-color:var(--chalk)}
button:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
button.pri{background:var(--yellow);border-color:var(--yellow);color:#2a2410;font-size:1.2rem;padding:12px 34px}
.preset{font-size:1.3rem;font-family:Jua,sans-serif;padding:10px 26px}
.preset.on{border-color:var(--yellow);color:var(--yellow)}
input[type=text],input[type=number],input[type=password]{font:inherit;background:var(--bg);color:var(--chalk);border:2px solid var(--line);border-radius:10px;padding:9px 12px}
input[type=number]{width:76px}
input.grow{flex:1;min-width:160px}
label{color:var(--dim);font-size:.92rem}
.hint{color:var(--dim);font-size:.85rem;margin:6px 0 0;line-height:1.5}
#playerWrap{aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;margin:12px 0}
#playerWrap iframe{width:100%;height:100%}
#results{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:8px;max-height:260px;overflow:auto}
#results button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:6px;font-weight:400}
#results img{width:80px;height:45px;object-fit:cover;border-radius:6px}
#msg{color:var(--red);font-size:.88rem;min-height:1.2em;margin:4px 0}
details{margin-top:8px}
summary{cursor:pointer;color:var(--dim)}
</style>
</head>
<body>
<section>
  <h2>자율시간</h2>
  <div id="time" aria-live="off">05:00</div>
  <div class="bar"><div id="fill"></div></div>
  <div class="row">
    <button class="preset" data-m="3">3분</button>
    <button class="preset on" data-m="5">5분</button>
    <button class="preset" data-m="10">10분</button>
    <span style="flex:1"></span>
    <input type="number" id="cm" min="0" max="180" value="5" aria-label="분"><label for="cm">분</label>
    <input type="number" id="cs" min="0" max="59" value="0" aria-label="초"><label for="cs">초</label>
  </div>
  <div class="row">
    <button class="pri" id="go">시작</button>
    <button id="reset">처음으로</button>
    <button id="plus">+1분</button>
  </div>

  <h2 style="margin-top:26px">끝났을 때 알람</h2>
  <div class="row">
    <input type="text" id="tts" class="grow" value="자율시간이 끝났어요. 자리로 돌아와 주세요." aria-label="알람 문구">
    <button id="ttsTest">미리 듣기</button>
  </div>
  <div class="row">
    <label>반복 <input type="number" id="rep" min="1" max="5" value="2"> 회</label>
    <label><input type="checkbox" id="beep" checked> 시작 전 알림음</label>
    <select id="voice" aria-label="목소리"></select>
  </div>
</section>

<section>
  <h2>음악 (유튜브)</h2>
  <div class="row">
    <input type="text" id="q" class="grow" placeholder="곡·플레이리스트 검색 또는 유튜브 링크 붙여넣기" aria-label="검색 또는 링크">
    <button id="search">검색</button>
  </div>
  <div id="msg" role="status"></div>
  <ul id="results"></ul>
  <div id="playerWrap"><div id="yt"></div></div>
  <div class="row">
    <button id="pp">재생/일시정지</button>
    <label>음량 <input type="range" id="vol" min="0" max="100" value="60"></label>
  </div>
  <div class="row">
    <label><input type="checkbox" id="autoStart" checked> 타이머 시작 시 음악 재생</label>
    <label><input type="checkbox" id="autoStop" checked> 끝나면 음악 멈춤</label>
  </div>
  <details>
    <summary>검색을 바로 쓰려면 (API 키)</summary>
    <div class="row" style="margin-top:10px">
      <input type="password" id="key" class="grow" placeholder="YouTube Data API v3 키" aria-label="API 키">
      <button id="saveKey">저장</button>
    </div>
    <p class="hint">키가 없으면 검색 버튼은 유튜브 뮤직 검색 창을 새 탭으로 열어요. 거기서 곡 링크를 복사해 위 칸에 붙여넣으면 바로 재생됩니다. 키는 이 브라우저에만 저장됩니다.</p>
  </details>
  <p class="hint">이 브라우저에서 프리미엄 계정으로 유튜브에 로그인해 두면 광고 없이 재생됩니다. 파일을 더블클릭해서 열면 영상이 막힐 수 있어요. 그럴 땐 폴더에서 <code>python -m http.server</code>를 실행하고 localhost 주소로 열어 주세요.</p>
</section>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
const $=id=>document.getElementById(id);
const store={get(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let total=300,endAt=0,left=300,running=false,tick=null,player=null,pending=null,ready=false;

function fmt(s){s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function draw(){$('time').textContent=fmt(left);$('fill').style.width=(total?left/total*100:0)+'%';$('time').classList.toggle('end',left<=10&&running);document.title=running?fmt(left)+' · 자율시간':'자율시간 타이머'}
function setDur(sec){total=left=sec;$('cm').value=Math.floor(sec/60);$('cs').value=sec%60;draw()}
function fromInputs(){const s=(+$('cm').value||0)*60+(+$('cs').value||0);total=left=Math.max(0,s);document.querySelectorAll('.preset').forEach(b=>b.classList.toggle('on',+b.dataset.m*60===s));draw()}

document.querySelectorAll('.preset').forEach(b=>b.onclick=()=>{stop();setDur(+b.dataset.m*60);fromInputs()});
$('cm').oninput=$('cs').oninput=()=>{if(!running)fromInputs()};

function start(){
  if(left<=0)return;
  running=true;endAt=Date.now()+left*1000;$('go').textContent='일시정지';
  primeSpeech();
  if($('autoStart').checked&&player&&player.playVideo)try{player.playVideo()}catch(e){}
  tick=setInterval(()=>{left=(endAt-Date.now())/1000;if(left<=0){left=0;finish()}draw()},200);draw();
}
function stop(){running=false;clearInterval(tick);$('go').textContent='시작';draw()}
function finish(){
  stop();left=0;draw();
  if($('autoStop').checked&&player&&player.pauseVideo)try{player.pauseVideo()}catch(e){}
  if($('beep').checked)beep();
  setTimeout(()=>speak($('tts').value,+$('rep').value||1),$('beep').checked?1100:0);
}
$('go').onclick=()=>running?stop():(left<=0?fromInputs():null,start());
$('reset').onclick=()=>{stop();fromInputs()};
$('plus').onclick=()=>{if(running){endAt+=60000;left=(endAt-Date.now())/1000}else left+=60;total=Math.max(total,left);draw()};

/* 알람 */
let ac;function beep(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();[0,.35,.7].forEach(t=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;o.connect(g);g.connect(ac.destination);const s=ac.currentTime+t;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.4,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+.28);o.start(s);o.stop(s+.3)})}catch(e){}}
function primeSpeech(){try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}catch(e){}}
function loadVoices(){const v=speechSynthesis.getVoices().filter(x=>x.lang.startsWith('ko'));const sel=$('voice');sel.innerHTML='';(v.length?v:speechSynthesis.getVoices()).forEach((x,i)=>{const o=document.createElement('option');o.value=x.name;o.textContent=x.name;sel.appendChild(o)});const s=store.get('voice','');if(s)sel.value=s}
try{speechSynthesis.onvoiceschanged=loadVoices;loadVoices()}catch(e){}
function speak(text,n=1){try{speechSynthesis.cancel();for(let i=0;i<n;i++){const u=new SpeechSynthesisUtterance(text);u.lang='ko-KR';u.rate=.95;const v=speechSynthesis.getVoices().find(x=>x.name===$('voice').value);if(v)u.voice=v;speechSynthesis.speak(u)}}catch(e){}}
$('ttsTest').onclick=()=>{primeSpeech();speak($('tts').value,1)};
$('tts').onchange=()=>store.set('tts',$('tts').value);
$('voice').onchange=()=>store.set('voice',$('voice').value);
$('rep').onchange=()=>store.set('rep',$('rep').value);

/* 유튜브 */
function msg(t){$('msg').textContent=t||''}
function onYouTubeIframeAPIReady(){
  player=new YT.Player('yt',{width:'100%',height:'100%',playerVars:{playsinline:1,rel:0},events:{
    onReady:()=>{ready=true;player.setVolume(+$('vol').value);if(pending){play(pending);pending=null}},
    onError:e=>msg('재생할 수 없어요(오류 '+e.data+'). 다른 곡을 고르거나 localhost로 열어 보세요.')}});
}
function parse(s){
  s=s.trim();let m;
  if(!/^https?:\/\//i.test(s))return null;
  try{const u=new URL(s);const list=u.searchParams.get('list');const v=u.searchParams.get('v');
    if(list&&!v)return{list};
    if(v)return{v,list};
    if(u.hostname==='youtu.be')return{v:u.pathname.slice(1)};
    if((m=u.pathname.match(/\/(embed|shorts|live)\/([\w-]{11})/)))return{v:m[2]};
  }catch(e){}
  return null;
}
function play(t){
  if(!ready){pending=t;return}
  msg('');
  if(t.list&&!t.v)player.loadPlaylist({list:t.list,listType:'playlist'});
  else if(t.v&&t.list)player.loadPlaylist({list:t.list,listType:'playlist',index:0});
  else player.loadVideoById(t.v);
  player.setVolume(+$('vol').value);
}
async function search(){
  const q=$('q').value.trim();if(!q)return;
  const p=parse(q);if(p){play(p);return}
  const key=store.get('ytkey','');
  if(!key){window.open('https://music.youtube.com/search?q='+encodeURIComponent(q),'_blank');msg('API 키가 없어 유튜브 뮤직을 새 탭으로 열었어요. 곡 링크를 붙여넣어 주세요.');return}
  try{
    const r=await fetch('https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoEmbeddable=true&maxResults=8&q='+encodeURIComponent(q)+'&key='+encodeURIComponent(key));
    const d=await r.json();if(d.error)throw new Error(d.error.message);
    const ul=$('results');ul.innerHTML='';
    (d.items||[]).forEach(it=>{const li=document.createElement('li'),b=document.createElement('button');
      const im=document.createElement('img');im.src=it.snippet.thumbnails.default.url;im.alt='';
      const sp=document.createElement('span');const tmp=document.createElement('div');tmp.innerHTML=it.snippet.title;sp.textContent=tmp.textContent;
      b.append(im,sp);b.onclick=()=>play({v:it.id.videoId});li.appendChild(b);ul.appendChild(li)});
    if(!d.items||!d.items.length)msg('검색 결과가 없어요.');
    else{msg('');play({v:d.items[0].id.videoId})}
  }catch(e){
    if(e instanceof TypeError)msg('구글 서버에 연결하지 못했어요. 미리보기가 아닌 브라우저에서 열었는지, 학교 네트워크·광고 차단 확장 프로그램이 막고 있지 않은지 확인해 주세요.');
    else msg('검색 실패: '+e.message);
  }
}
$('search').onclick=search;
$('q').onkeydown=e=>{if(e.key==='Enter')search()};
$('pp').onclick=()=>{if(!ready)return;try{player.getPlayerState()===1?player.pauseVideo():player.playVideo()}catch(e){}};
$('vol').oninput=()=>{if(ready)player.setVolume(+$('vol').value);store.set('vol',$('vol').value)};
$('saveKey').onclick=()=>{store.set('ytkey',$('key').value.trim());msg('API 키를 저장했어요.')};
['autoStart','autoStop','beep'].forEach(id=>$(id).onchange=()=>store.set(id,$(id).checked?'1':'0'));

/* 저장값 복원 */
$('tts').value=store.get('tts',$('tts').value);$('rep').value=store.get('rep','2');$('vol').value=store.get('vol','60');
$('key').value=store.get('ytkey','');
['autoStart','autoStop','beep'].forEach(id=>{$(id).checked=store.get(id,'1')==='1'});
fromInputs();
</script>
</body>
</html>
